name: Build and release AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Run static self-test
        run: python self_test.py

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libice6 \
            libnss3 \
            libopengl0 \
            libpython3.10 \
            libsm6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxext6 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxrender1

      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Smoke-test AppImage
        run: |
          APPIMAGE=$(find dist -maxdepth 1 -name 'PIA-Bazzite-*-x86_64.AppImage' -print -quit)
          chmod +x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version
          sha256sum "$APPIMAGE" > "$APPIMAGE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: PIA-Bazzite-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_0.5.0.md
          files: |
            dist/*.AppImage
            dist/*.sha256
