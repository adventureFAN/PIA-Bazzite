name: Build and release AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install test and build runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libice6 \
            libnss3 \
            libopengl0 \
            libpython3.10 \
            libsm6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxext6 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxrender1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run authoritative unprivileged release gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash tools/release-unprivileged-gate.sh

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          EXPECTED="v$(python -c 'from pia_bazzite import __version__; print(__version__)')"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match application version $EXPECTED." >&2
            exit 1
          fi

      - name: Restore exact release source snapshot after tests
        run: |
          git reset --hard "$GITHUB_SHA"
          git clean -ffdx
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build AppImage from exact checked-out commit
        env:
          PIA_BAZZITE_BUILD_MODE: release
          PIA_BAZZITE_SOURCE_COMMIT: ${{ github.sha }}
        run: ./packaging/build-appimage.sh

      - name: Smoke-test AppImage
        run: |
          APPIMAGE=$(find dist -maxdepth 1 -name 'PIA-Bazzite-*-x86_64.AppImage' -print -quit)
          chmod +x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version
          (cd dist && sha256sum --check "$(basename "$APPIMAGE").sha256")
          (cd dist && sha256sum "$(basename "$APPIMAGE")" > "$(basename "$APPIMAGE").sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PIA-Bazzite-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: RELEASE_NOTES_0.6.0.md
          files: |
            dist/*.AppImage
            dist/*.sha256
